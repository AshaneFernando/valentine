<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffb199);
    overflow: hidden;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    color: white;
    width: 90%;
    max-width: 500px;
    position: relative;
    z-index: 1;
}

h1 {
    font-size: 6vw;
    margin-bottom: 25px;
    text-shadow: 2px 2px 12px rgba(0,0,0,0.7);
}

.buttons {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
}

button {
    padding: 14px 25px;
    font-size: 4vw;
    font-weight: bold;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.3s ease, transform 0.3s ease;
    position: relative;
}

#yesBtn {
    background-color: #ff2e63;
    color: white;
}

#noBtn {
    background-color: white;
    color: #ff2e63;
}

#message {
    margin-top: 40px;
    font-size: 5vw;
    min-height: 60px;
    text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
}

/* Celebration */
.celebration-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(24px, 10vw, 80px);
    font-weight: bold;
    color: #FFD700;
    text-align: center;
    white-space: pre-line;
    text-shadow: 4px 4px 20px #FF69B4, 2px 2px 15px #FF1493;
    animation: popAndGlow 1s forwards, pulse 2s infinite alternate;
    z-index: 1000;
}

@keyframes popAndGlow {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(0.9); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

@keyframes pulse {
    0% { text-shadow: 4px 4px 20px #FF69B4, 2px 2px 15px #FF1493; }
    100% { text-shadow: 0 0 40px #FFD700, 0 0 60px #FF1493, 0 0 80px #FF69B4; }
}

.heart {
    position: absolute;
    color: #ff69b4;
    animation: float 6s linear infinite;
    font-size: 25px;
    z-index: 500;
}

@keyframes float {
    from { transform: translateY(100vh) rotate(0deg); opacity: 1; }
    to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="container">
    <h1 id="title">Will You Be My Valentine? 💖</h1>
    <div class="buttons" id="buttonArea">
        <button id="yesBtn">YES 💕</button>
        <button id="noBtn">NO 😏</button>
    </div>
    <div id="message"></div>
</div>

<script>
const yesQuotes = [
    "You chose wisely, darling.",
    "Contract signed. No refunds.",
    "Love subscription activated.",
    "You’re stuck now.",
    "Achievement unlocked: Me.",
    "Marriage speedrun initiated.💕",
    "I was hoping you’d say that. 😌",
    "I knew it 😌.",
    "You passed the test.💖"
];

const noQuotes = [
    "That’s suspicious behavior.",
    "Wrong answer detected.",
    "Incorrect. Try again.",
    "Be serious right now.",
    "You misclicked. Obviously.",
    "Are you suuuure? Try again… I’ll wait. 😌",
    "Error 404: ‘No’ not found.",
    "Denied. Try again",
    "System error: Nope"
];

let yesScale = 1;
let yesIndex = 0;
let noClickCount = 0;

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");
const container = document.querySelector('.container');

yesBtn.addEventListener("click", () => {
    if (yesIndex < yesQuotes.length) {
        message.innerText = yesQuotes[yesIndex];
        yesIndex++;
        yesScale += 0.25;
        yesBtn.style.transform = `scale(${yesScale})`;
        createHearts();
    } else {
        triggerCelebration();
    }
});

noBtn.addEventListener("click", () => {
    if (noClickCount < noQuotes.length) {
        message.innerText = noQuotes[noClickCount];
    } else {
        message.innerText = "You’re committed to chaos.";
    }
    noClickCount++;
    moveNoButton();
});

function moveNoButton() {
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;

    // Constrain to container bounds
    const rect = container.getBoundingClientRect();
    const maxX = rect.width - btnWidth;
    const maxY = rect.height - btnHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.position = 'absolute';
    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';
}

function triggerCelebration() {
    yesBtn.style.display = "none";
    noBtn.style.display = "none";

    const congrats = document.createElement("div");
    congrats.classList.add("celebration-message");
    congrats.innerText = "🎉 CONGRATULATIONS! 🎉\nYou Passed the Test! 💖";
    document.body.appendChild(congrats);

    for (let i = 0; i < 100; i++) createHearts();
    let heartInterval = setInterval(createHearts, 200);
    setTimeout(() => clearInterval(heartInterval), 8000);
}

function createHearts() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 40 + 20) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
</script>

</body>
</html>
